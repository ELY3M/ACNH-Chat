name: Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
  workflow_call:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
       dotnet-version: '10.0.x'
      
    - name: Restore .NET Workloads
      run: dotnet workload restore
  
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

          
    - name: Decode key
      uses: timheuer/base64-to-file@v1.2
      with:
       fileName: key.jks
       fileDir: ${{ github.workspace }}
       encodedString: ${{ secrets.KEY }}
     
               
    - name: build windows 
      run: |
        dotnet publish ${{ github.workspace }}/ACNHChat.Desktop/ACNHChat.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:UseMonoRuntime=false -o ./publish-windows

    - name: build linux
      run: |
        dotnet publish ${{ github.workspace }}/ACNHChat.Desktop/ACNHChat.Desktop.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:UseMonoRuntime=false -o ./publish-linux

    - name: build android
      run: |
        dotnet publish ${{ github.workspace }}/ACNHChat.Android/ACNHChat.Android.csproj -f net10.0-android -c Release -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=${{ github.workspace }}/key.jks -p:AndroidSigningKeyAlias=${{ secrets.ALIAS }} -p:AndroidSigningKeyPass=${{ secrets.PASSWORD }} -p:AndroidSigningStorePass=${{ secrets.PASSWORD }} -o ./publish-android

    - name: list
      run: |
        ls -la publish-windows
        ls -la publish-linux
        ls -la publish-windows  
        
    - name: Create Release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ github.token }} 
      with:
        draft: false
        prerelease: false
        release_name: ${{ steps.version.outputs.version }}
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: false    
        tag_name: ${{ github.run_number }}
        body: ${{ github.event.head_commit.message }}
        files: ${{ github.workspace }}/publish-windows/ACNHChat.Desktop.exe, ${{ github.workspace }}/publish-linux/ACNHChat.Desktop, ${{ github.workspace }}/publish-android/own.ACNHChat-Signed.apk
      env:
        GITHUB_TOKEN: ${{ github.token }} 
        
        

        